<!doctype html>
<html lang="en" data-native-glass="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overlay</title>
    <link rel="stylesheet" href="./glass.css" />
  </head>
  <body data-mode="camera">
    <!-- Rim refraction filter (§6). Gated in CSS behind reduced-transparency. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <filter id="rim-refract" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <header class="drag"></header>

    <div class="pane modes" role="tablist" aria-label="Capture source">
      <div class="modes__knob" aria-hidden="true"></div>
      <button type="button" role="tab" data-mode-button="camera" aria-selected="true">Camera</button>
      <button type="button" role="tab" data-mode-button="screen" aria-selected="false">Screen</button>
    </div>

    <p class="section-label">
      <span>Overlays</span>
      <span class="tabular" data-count></span>
    </p>

    <section class="pane library" data-library>
      <ul class="list" data-list hidden></ul>
      <div class="empty" data-empty>
        <strong>Drop a PNG here.</strong>
        <span>Transparent background works best.</span>
      </div>
      <button type="button" class="add" data-add>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        Add PNG
      </button>
    </section>

    <section class="pane" data-screen-panel hidden style="margin-top: 16px">
      <div class="sources" data-sources></div>
      <div class="toggle-row">
        <span>Overlay my desktop<br /><small style="color: var(--ink-faint)">Click-through, always on top</small></span>
        <button type="button" class="switch" data-overlay-toggle aria-pressed="false" aria-label="Overlay my desktop"></button>
      </div>
    </section>

    <footer class="footer">
      <button type="button" class="start" data-start>Start</button>
      <p class="note" data-note>Nothing leaves this machine.</p>
    </footer>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
